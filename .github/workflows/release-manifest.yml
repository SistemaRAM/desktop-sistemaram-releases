name: Release Manifest

on:
  create:
  release:
    types: [released, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)process (e.g. manager.v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true

      - name: Resolve product & target file
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.ref }}"
          fi

          if [[ "$TAG" =~ ^(manager|comandas|instaladores|drivers|ramprint|add-?ons)\.(.+)$ ]]; then
            PRODUCT="${BASH_REMATCH[1]}"
          else
            PRODUCT=""
          fi

          case "$PRODUCT" in
            manager) FILE="releases-manager.json" ;;
            comandas) FILE="releases-comandas.json" ;;
            instaladores) FILE="releases-instaladores.json" ;;
            drivers) FILE="releases-drivers.json" ;;
            ramprint) FILE="releases-ramprint.json" ;;
            add-ons|addons) FILE="releases-addons.json" ;;
            *) FILE="releases.json" ;;
          esac

          echo "Tag: $TAG -> file: $FILE"
          {
            echo "tag=$TAG"
            echo "file=$FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for release & fetch data
        id: release
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          ATTEMPTS=10
          SLEEP=15
          RELEASE_JSON=""

          for i in $(seq 1 "$ATTEMPTS"); do
            if RELEASE_JSON=$(gh release view "$TAG" --json name,url,assets,body 2>/dev/null); then
              break
            fi
            RELEASE_JSON=""
            echo "Release for tag $TAG not found yet (attempt $i/$ATTEMPTS), retrying in ${SLEEP}s..."
            sleep "$SLEEP"
          done

          if [ -z "$RELEASE_JSON" ]; then
            echo "No release found for $TAG after $ATTEMPTS attempts. Falling back to defaults."
            NAME="$TAG"
            LINK="https://github.com/$GH_REPO/releases/tag/$TAG"
            DESCRIPTION=""
            echo '[]' > anexos.json
          else
            NAME=$(echo "$RELEASE_JSON" | jq -r '.name // empty')
            [ -z "$NAME" ] && NAME="$TAG"
            LINK=$(echo "$RELEASE_JSON" | jq -r '.url')
            DESCRIPTION=$(echo "$RELEASE_JSON" | jq -r '.body // empty')

            # Anexos via REST API: expõe `digest` (sha256:...) calculado pelo GitHub.
            gh api "repos/$GH_REPO/releases/tags/$TAG" \
              --jq '[.assets[] | {id: .id, name: .name, url: .browser_download_url, size: .size, sha256: ((.digest // "") | sub("^sha256:"; ""))}]' \
              > assets_raw.json

            # Fallback: se o GitHub não informou o digest, baixa o anexo e calcula.
            echo '[]' > anexos.json
            while read -r ASSET; do
              SHA=$(echo "$ASSET" | jq -r '.sha256')
              if [ -z "$SHA" ]; then
                ID=$(echo "$ASSET" | jq -r '.id')
                echo "Digest ausente para $(echo "$ASSET" | jq -r '.name'); calculando via download..."
                SHA=$(gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$ID" | sha256sum | cut -d' ' -f1)
              fi
              jq --argjson a "$ASSET" --arg sha "$SHA" \
                '. + [{name: $a.name, url: $a.url, size: $a.size, sha256: $sha}]' \
                anexos.json > anexos.tmp && mv anexos.tmp anexos.json
            done < <(jq -c '.[]' assets_raw.json)
            rm -f assets_raw.json
          fi

          {
            echo "name=$NAME"
            echo "link=$LINK"
            echo "description<<EOF_DESC"
            echo "$DESCRIPTION"
            echo "EOF_DESC"
          } >> "$GITHUB_OUTPUT"

      - name: Update manifest
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          FILE: ${{ steps.resolve.outputs.file }}
          NAME: ${{ steps.release.outputs.name }}
          LINK: ${{ steps.release.outputs.link }}
          DESCRIPTION: ${{ steps.release.outputs.description }}
        run: |
          set -euo pipefail
          [ -f "$FILE" ] || echo '{}' > "$FILE"

          jq -n \
            --arg name "$NAME" \
            --arg tag "$TAG" \
            --arg link "$LINK" \
            --arg description "$DESCRIPTION" \
            --slurpfile anexos anexos.json \
            '{name: $name, tag: $tag, link: $link, description: $description, anexos: $anexos[0]}' > entry.json

          jq --arg tag "$TAG" --slurpfile entry entry.json \
            '.[$tag] = $entry[0]' "$FILE" > "$FILE.tmp"
          mv "$FILE.tmp" "$FILE"

          rm -f entry.json anexos.json

      - name: Commit & push manifest
        env:
          FILE: ${{ steps.resolve.outputs.file }}
          TAG: ${{ steps.resolve.outputs.tag }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: add $TAG to $FILE"

          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push failed (attempt $i/5), retrying..."
            sleep 5
          done

          echo "Failed to push manifest update after 5 attempts."
          exit 1
